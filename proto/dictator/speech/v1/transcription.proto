syntax = "proto3";

package dictator.speech.v1;

import "dictator/speech/v1/common.proto";
import "google/protobuf/struct.proto";

service TranscriptionService {
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse);
  rpc SubmitTranscribeJob(TranscribeRequest) returns (SubmitTranscribeJobResponse);
  rpc GetTranscribeJob(GetTranscribeJobRequest) returns (GetTranscribeJobResponse);
  rpc DiarizeAudio(DiarizeAudioRequest) returns (DiarizeAudioResponse);
  rpc SubmitDiarizeAudioJob(DiarizeAudioRequest) returns (SubmitDiarizeAudioJobResponse);
  rpc GetDiarizeAudioJob(GetDiarizeAudioJobRequest) returns (GetDiarizeAudioJobResponse);
}

enum TranscriptionJobState {
  TRANSCRIPTION_JOB_STATE_UNSPECIFIED = 0;
  TRANSCRIPTION_JOB_STATE_QUEUED = 1;
  TRANSCRIPTION_JOB_STATE_RUNNING = 2;
  TRANSCRIPTION_JOB_STATE_SUCCEEDED = 3;
  TRANSCRIPTION_JOB_STATE_FAILED = 4;
}

enum DiarizationJobState {
  DIARIZATION_JOB_STATE_UNSPECIFIED = 0;
  DIARIZATION_JOB_STATE_QUEUED = 1;
  DIARIZATION_JOB_STATE_RUNNING = 2;
  DIARIZATION_JOB_STATE_SUCCEEDED = 3;
  DIARIZATION_JOB_STATE_FAILED = 4;
}

message TranscribeRequest {
  string audio_artifact_id = 1;
  string language_code = 2;
  string model_size = 3;
  bool include_word_segments = 4;
  bool autodetect_language = 5;
}

message TranscribeResponse {
  string text = 1;
  string language_code = 2;
  repeated WordSegment words = 3;
}

message SubmitTranscribeJobResponse {
  string job_id = 1;
  TranscriptionJobState state = 2;
}

message GetTranscribeJobRequest {
  string job_id = 1;
}

message GetTranscribeJobResponse {
  string job_id = 1;
  TranscriptionJobState state = 2;
  string error_code = 3;
  string error_message = 4;
  string text = 5;
  string language_code = 6;
  repeated WordSegment words = 7;
  double created_at_unix_seconds = 8;
  double started_at_unix_seconds = 9;
  double finished_at_unix_seconds = 10;
}

message DiarizeAudioRequest {
  string audio_artifact_id = 1;
  string language_code = 2;
  string model_size = 3;
  bool include_words = 4;
  bool include_utterances = 5;
  bool include_speaker_segments = 6;
  optional double utterance_gap_seconds = 7;
  bool persist_json_artifact = 8;
  bool include_speakers = 9;
  bool autodetect_language = 10;
}

message DiarizeAudioResponse {
  string text = 1;
  string language_code = 2;
  google.protobuf.Struct diarization = 3;
  string diarization_artifact_id = 4;
}

message SubmitDiarizeAudioJobResponse {
  string job_id = 1;
  DiarizationJobState state = 2;
}

message GetDiarizeAudioJobRequest {
  string job_id = 1;
}

message GetDiarizeAudioJobResponse {
  string job_id = 1;
  DiarizationJobState state = 2;
  string error_code = 3;
  string error_message = 4;
  string text = 5;
  string language_code = 6;
  google.protobuf.Struct diarization = 7;
  string diarization_artifact_id = 8;
  double created_at_unix_seconds = 9;
  double started_at_unix_seconds = 10;
  double finished_at_unix_seconds = 11;
}
