syntax = "proto3";

package dictator.speech.v1;

option go_package = "github.com/tyemirov/dictator/sdk/go/dictatorspeechv1;dictatorspeechv1";

import "dictator/speech/v1/common.proto";

service VoiceService {
  rpc ListSynthesisVoices(ListSynthesisVoicesRequest)
      returns (ListSynthesisVoicesResponse);

  rpc ExtractReferenceSample(ExtractReferenceSampleRequest)
      returns (ExtractReferenceSampleResponse);

  rpc SubmitExtractReferenceSampleJob(ExtractReferenceSampleRequest)
      returns (SubmitExtractReferenceSampleJobResponse);

  rpc GetExtractReferenceSampleJob(GetExtractReferenceSampleJobRequest)
      returns (GetExtractReferenceSampleJobResponse);
  rpc CancelExtractReferenceSampleJob(CancelExtractReferenceSampleJobRequest)
      returns (CancelExtractReferenceSampleJobResponse);

  rpc SynthesizeSpeech(SynthesizeSpeechRequest)
      returns (SynthesizeSpeechResponse);

  rpc SubmitSynthesizeSpeechJob(SynthesizeSpeechRequest)
      returns (SubmitSynthesizeSpeechJobResponse);

  rpc GetSynthesizeSpeechJob(GetSynthesizeSpeechJobRequest)
      returns (GetSynthesizeSpeechJobResponse);
  rpc CancelSynthesizeSpeechJob(CancelSynthesizeSpeechJobRequest)
      returns (CancelSynthesizeSpeechJobResponse);
}

enum SynthesisEngine {
  SYNTHESIS_ENGINE_UNSPECIFIED = 0;
  SYNTHESIS_ENGINE_QWEN3 = 1;
  SYNTHESIS_ENGINE_SILERO_RU = 2;
}

enum SynthesisJobState {
  SYNTHESIS_JOB_STATE_UNSPECIFIED = 0;
  SYNTHESIS_JOB_STATE_QUEUED = 1;
  SYNTHESIS_JOB_STATE_RUNNING = 2;
  SYNTHESIS_JOB_STATE_SUCCEEDED = 3;
  SYNTHESIS_JOB_STATE_FAILED = 4;
  SYNTHESIS_JOB_STATE_CANCELED = 5;
}

enum ExtractReferenceSampleJobState {
  EXTRACT_REFERENCE_SAMPLE_JOB_STATE_UNSPECIFIED = 0;
  EXTRACT_REFERENCE_SAMPLE_JOB_STATE_QUEUED = 1;
  EXTRACT_REFERENCE_SAMPLE_JOB_STATE_RUNNING = 2;
  EXTRACT_REFERENCE_SAMPLE_JOB_STATE_SUCCEEDED = 3;
  EXTRACT_REFERENCE_SAMPLE_JOB_STATE_FAILED = 4;
  EXTRACT_REFERENCE_SAMPLE_JOB_STATE_CANCELED = 5;
}

message ExtractReferenceSampleRequest {
  string source_artifact_id = 1;
  string model_size = 2;
  string language_code = 3;
  double duration_seconds = 4;
  double max_speech_rate = 5;
  double min_centroid_hz = 6;
  double max_centroid_hz = 7;
}

message ExtractReferenceSampleResponse {
  ArtifactRef sample_artifact = 1;
  double trim_start_seconds = 2;
  double trim_end_seconds = 3;
  double window_start_seconds = 4;
  double window_end_seconds = 5;
  int32 dominant_speaker_word_count = 6;
}

message SubmitExtractReferenceSampleJobResponse {
  string job_id = 1;
  ExtractReferenceSampleJobState state = 2;
}

message GetExtractReferenceSampleJobRequest {
  string job_id = 1;
}

message GetExtractReferenceSampleJobResponse {
  string job_id = 1;
  ExtractReferenceSampleJobState state = 2;
  string error_code = 3;
  string error_message = 4;
  ArtifactRef sample_artifact = 5;
  double trim_start_seconds = 6;
  double trim_end_seconds = 7;
  double window_start_seconds = 8;
  double window_end_seconds = 9;
  int32 dominant_speaker_word_count = 10;
  double created_at_unix_seconds = 11;
  double started_at_unix_seconds = 12;
  double finished_at_unix_seconds = 13;
  string source_artifact_id = 14;
}

message CancelExtractReferenceSampleJobRequest {
  string job_id = 1;
}

message CancelExtractReferenceSampleJobResponse {
  string job_id = 1;
  ExtractReferenceSampleJobState state = 2;
}

message ListSynthesisVoicesRequest {
  SynthesisEngine synthesis_engine = 1;
  string language_code = 2;
}

message SynthesisVoice {
  SynthesisEngine synthesis_engine = 1;
  string language_code = 2;
  string voice_id = 3;
  string display_name = 4;
  bool is_default = 5;
  repeated int32 native_sample_rate_hz = 6;
  int32 default_sample_rate_hz = 7;
  bool requires_reference_audio = 8;
}

message ListSynthesisVoicesResponse {
  repeated SynthesisVoice voices = 1;
}

message SynthesizeSpeechRequest {
  string speaker_artifact_id = 1;
  oneof text_source {
    string text = 2;
    string text_artifact_id = 3;
  }
  string language_code = 4;
  double max_duration_seconds = 5;
  bool include_timeline = 6;
  SynthesisEngine synthesis_engine = 7;
  string speaker_transcript_text = 8;
  AudioFormat audio_format = 9;
  string preset_speaker = 10;
}

message SynthesizeSpeechResponse {
  ArtifactRef audio_artifact = 1;
  double audio_duration_seconds = 2;
  repeated TimelineSegment timeline = 3;
  string timeline_artifact_id = 4;
  int32 chunk_count = 5;
  AudioFormat resolved_audio_format = 6;
}

message SubmitSynthesizeSpeechJobResponse {
  string job_id = 1;
  SynthesisJobState state = 2;
}

message GetSynthesizeSpeechJobRequest {
  string job_id = 1;
}

message GetSynthesizeSpeechJobResponse {
  string job_id = 1;
  SynthesisJobState state = 2;
  string error_code = 3;
  string error_message = 4;
  ArtifactRef audio_artifact = 5;
  double audio_duration_seconds = 6;
  string timeline_artifact_id = 7;
  int32 chunk_count = 8;
  double created_at_unix_seconds = 9;
  double started_at_unix_seconds = 10;
  double finished_at_unix_seconds = 11;
  int32 estimated_total_chunks = 12;
  int32 completed_chunks = 13;
  AudioFormat resolved_audio_format = 14;
}

message CancelSynthesizeSpeechJobRequest {
  string job_id = 1;
}

message CancelSynthesizeSpeechJobResponse {
  string job_id = 1;
  SynthesisJobState state = 2;
}
