syntax = "proto3";

package dictator.speech.v1;

option go_package = "github.com/tyemirov/dictator/sdk/go/dictatorspeechv1;dictatorspeechv1";

message ArtifactRef {
  string artifact_id = 1;
  string filename = 2;
  string media_type = 3;
  int64 size_bytes = 4;
  string sha256 = 5;
  AudioMetadata audio_metadata = 6;
}

enum AudioContainer {
  AUDIO_CONTAINER_UNSPECIFIED = 0;
  AUDIO_CONTAINER_WAV = 1;
}

enum AudioCodec {
  AUDIO_CODEC_UNSPECIFIED = 0;
  AUDIO_CODEC_PCM_S16LE = 1;
}

message AudioFormat {
  AudioContainer container = 1;
  AudioCodec codec = 2;
  int32 sample_rate_hz = 3;
  int32 channel_count = 4;
  int32 bit_depth = 5;
}

message AudioMetadata {
  string container = 1;
  string codec = 2;
  int32 sample_rate_hz = 3;
  int32 channel_count = 4;
  int32 bit_depth = 5;
  double duration_seconds = 6;
}

message WordSegment {
  string content = 1;
  double start_seconds = 2;
  double end_seconds = 3;
}

message TimelineSegment {
  string content = 1;
  double start_seconds = 2;
  double end_seconds = 3;
}
