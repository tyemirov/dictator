syntax = "proto3";

package dictator.speech.v1;

service SubtitleService {
  rpc RenderSubtitles(RenderSubtitlesRequest) returns (RenderSubtitlesResponse);
  rpc SubmitRenderSubtitlesJob(RenderSubtitlesRequest)
      returns (SubmitRenderSubtitlesJobResponse);
  rpc GetRenderSubtitlesJob(GetRenderSubtitlesJobRequest)
      returns (GetRenderSubtitlesJobResponse);
}

enum SubtitleJobState {
  SUBTITLE_JOB_STATE_UNSPECIFIED = 0;
  SUBTITLE_JOB_STATE_QUEUED = 1;
  SUBTITLE_JOB_STATE_RUNNING = 2;
  SUBTITLE_JOB_STATE_SUCCEEDED = 3;
  SUBTITLE_JOB_STATE_FAILED = 4;
}

enum SubtitleFormat {
  SUBTITLE_FORMAT_UNSPECIFIED = 0;
  SUBTITLE_FORMAT_SRT = 1;
}

enum SubtitleGranularity {
  SUBTITLE_GRANULARITY_UNSPECIFIED = 0;
  SUBTITLE_GRANULARITY_WORDS = 1;
  SUBTITLE_GRANULARITY_SENTENCES = 2;
}

enum SubtitleMode {
  SUBTITLE_MODE_UNSPECIFIED = 0;
  SUBTITLE_MODE_TRANSCRIPTION = 1;
  SUBTITLE_MODE_FORCED_ALIGNMENT = 2;
}

message SubtitleCue {
  string content = 1;
  double start_seconds = 2;
  double end_seconds = 3;
  int32 item_count = 4;
}

message RenderSubtitlesRequest {
  string audio_artifact_id = 1;
  string language_code = 2;
  bool autodetect_language = 3;
  string model_size = 4;
  SubtitleFormat output_format = 5;
  SubtitleGranularity granularity = 6;
  int32 group_size = 7;
  oneof source_text_source {
    string source_text = 8;
    string source_text_artifact_id = 9;
  }
  string source_text_name = 10;
  bool include_srt_text = 11;
}

message RenderSubtitlesResponse {
  string language_code = 1;
  SubtitleMode mode = 2;
  SubtitleFormat output_format = 3;
  SubtitleGranularity granularity = 4;
  int32 group_size = 5;
  repeated SubtitleCue cues = 6;
  string srt_text = 7;
  string srt_artifact_id = 8;
}

message SubmitRenderSubtitlesJobResponse {
  string job_id = 1;
  SubtitleJobState state = 2;
}

message GetRenderSubtitlesJobRequest {
  string job_id = 1;
}

message GetRenderSubtitlesJobResponse {
  string job_id = 1;
  SubtitleJobState state = 2;
  string error_code = 3;
  string error_message = 4;
  string language_code = 5;
  SubtitleMode mode = 6;
  SubtitleFormat output_format = 7;
  SubtitleGranularity granularity = 8;
  int32 group_size = 9;
  repeated SubtitleCue cues = 10;
  string srt_text = 11;
  string srt_artifact_id = 12;
  double created_at_unix_seconds = 13;
  double started_at_unix_seconds = 14;
  double finished_at_unix_seconds = 15;
}
