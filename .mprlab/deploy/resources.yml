mprlab_resources:
    artifacts:
        container_images:
            - build:
                context: .
                dockerfile: Dockerfile.gpu
                platforms:
                    - linux/amd64
              id: backend-image
        go_modules:
            - id: go-sdk
              module: github.com/tyemirov/dictator/sdk/go/dictatorspeechv1
              source: sdk/go/dictatorspeechv1
              version: v1.12.0
    environment:
        private_inputs:
            - id: deploy-sudo-password-computercat
              variable: DEPLOY_SUDO_PASSWORD_COMPUTERCAT
            - id: deploy-sudo-password-tutosh
              variable: DEPLOY_SUDO_PASSWORD_TUTOSH
            - id: dictator-grpc-auth-token
              variable: DICTATOR_GRPC_AUTH_TOKEN
            - id: hf-token
              variable: HF_TOKEN
        source: .mprlab/deploy/.env
    lifecycle:
        ci:
            command:
                - make
                - ci
            enabled: true
        defaults:
            timeouts:
                completion: 30m
                readiness: 5m
                request: 30s
                shutdown: 30s
                startup: 2m
        operations:
            - name: app-deploy
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 20m
            - name: app-plan-deploy
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 2m
            - name: app-plan-publish
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 2m
            - name: app-plan-release
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 2m
            - name: app-publish
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 4h
            - name: app-release
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
              timeouts:
                completion: 2h
            - name: app_lifecycle.repository_read
              polling:
                attempt_limit: 60
                increment: 2s
                initial: 2s
                maximum: 15s
                multiplier: 2
            - name: ci
              timeouts:
                completion: 30m
        private_inputs:
            operations: []
    owner: dictator
    publications:
        ghcr:
            images:
                - artifact: backend-image
                  id: backend-image
                  repository: ghcr.io/tyemirov/dictator
        git:
            modules:
                - artifact: go-sdk
                  id: go-sdk
    release:
        scheme: semver
    targets:
        access:
            hosts:
                - elevation_password:
                    input: deploy-sudo-password-computercat
                  host: computercat-host
                - elevation_password:
                    input: deploy-sudo-password-tutosh
                  host: tutosh
        docker_compose:
            projects:
                - id: computercat-runtime
                  retired_services:
                    - project: mprlab-gateway
                      service: dictator
                  services:
                    - command:
                        - python
                        - serve.py
                        - --config
                        - /app/config.yml
                      endpoints:
                        - endpoint:
                            port: 50002
                            scheme: grpc
                            scope: private_lan
                          health:
                            protocol: tcp
                          id: grpc
                          name: dictator.grpc
                          version: 1
                      environment:
                        - input: dictator-grpc-auth-token
                          name: DICTATOR_GRPC_AUTH_TOKEN
                        - input: hf-token
                          name: HF_TOKEN
                        - name: NVIDIA_DRIVER_CAPABILITIES
                          value: compute,utility
                        - name: NVIDIA_VISIBLE_DEVICES
                          value: all
                      gpu: true
                      id: dictator
                      image:
                        publication: backend-image
                      mounts:
                        - read_only: false
                          target: /app/.dictator-artifacts
                          volume: artifacts
                        - read_only: false
                          target: /home/app/.cache/huggingface
                          volume: huggingface-cache
                        - read_only: false
                          target: /home/app/.cache/torch
                          volume: torch-cache
                        - read_only: false
                          target: /home/app/.cache/whisper
                          volume: whisper-cache
                      placement:
                        cardinality: one
                        group: computercat
                      ports:
                        - container_port: 50051
                          host_port: 50002
                          scope: private_lan
                  volumes:
                    - id: artifacts
                      name: dictator_dictator-artifacts
                      retention: retain
                    - id: huggingface-cache
                      name: dictator_huggingface-cache
                      retention: retain
                    - id: torch-cache
                      name: dictator_torch-cache
                      retention: retain
                    - id: whisper-cache
                      name: dictator_whisper-cache
                      retention: retain
        ingress:
            caddy:
                routes:
                    - handlers:
                        - id: default
                          path_prefix: /
                          transport:
                            dial_timeout_seconds: 10
                            protocol: h2c
                            read_timeout_seconds: 600
                            response_header_timeout_seconds: 30
                          upstream: dictator.grpc
                      hostname: dictator.mprlab.com
                      id: public-grpc
                      listener: https
                      tls:
                        mode: automatic
