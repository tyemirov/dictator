---
mprlab_resources:
  owner: dictator
  release:
    scheme: semver
  resources:
    go-sdk:
      kind: go_module
      source: sdk/go/dictatorspeechv1
      module: github.com/tyemirov/dictator/sdk/go/dictatorspeechv1
      version: v1.12.0
    private:
      kind: private_values
      bindings:
        grpc-auth-token: DICTATOR_GRPC_AUTH_TOKEN
        huggingface-token: HF_TOKEN
    computercat-runtime:
      kind: compose_project
      retired_services:
        mprlab-gateway/dictator: {}
      images:
        backend-image:
          repository: ghcr.io/tyemirov/dictator
          build:
            context: .
            dockerfile: Dockerfile.gpu
            platforms:
            - linux/amd64
      services:
        dictator:
          image: backend-image
          placement:
            group: computercat
            cardinality: one
          command:
            '0': python
            '1': serve.py
            '2': --config
            '3': /app/config.yml
          environment:
            DICTATOR_GRPC_AUTH_TOKEN:
              resource: private
              output: grpc-auth-token
            HF_TOKEN:
              resource: private
              output: huggingface-token
            NVIDIA_DRIVER_CAPABILITIES:
              value: compute,utility
            NVIDIA_VISIBLE_DEVICES:
              value: all
          mounts:
            /app/.dictator-artifacts:
              volume: artifacts
              read_only: false
            /home/app/.cache/huggingface:
              volume: huggingface-cache
              read_only: false
            /home/app/.cache/whisper:
              volume: whisper-cache
              read_only: false
            /home/app/.cache/torch:
              volume: torch-cache
              read_only: false
          ports:
            '50051':
              host_port: 50002
              scope: private_lan
          gpu: true
      volumes:
        artifacts:
          name: dictator_dictator-artifacts
          retention: retain
        huggingface-cache:
          name: dictator_huggingface-cache
          retention: retain
        whisper-cache:
          name: dictator_whisper-cache
          retention: retain
        torch-cache:
          name: dictator_torch-cache
          retention: retain
    grpc:
      kind: runtime_capability
      name: dictator.grpc
      version: 1
      project: computercat-runtime
      service: dictator
      endpoint:
        scope: private_lan
        scheme: grpc
        port: 50002
      health:
        protocol: tcp
    public-grpc:
      kind: caddy_route
      hostname: dictator.mprlab.com
      listener: https
      handlers:
        default:
          path_prefix: /
          upstream: dictator.grpc
          transport:
            protocol: h2c
            dial_timeout_seconds: 10
            response_header_timeout_seconds: 30
            read_timeout_seconds: 600
      tls:
        mode: automatic
