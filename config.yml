server:
  listen:
    host: 0.0.0.0
    port: 50051
  grpc:
    max_message_bytes: 67108864
    auth_token: ${DICTATOR_GRPC_AUTH_TOKEN}

execution:
  concurrency:
    workers: 4
    inflight: 4
  jobs:
    wait_timeout_seconds: 300.0
    poll_interval_seconds: 1.0
    synthesis:
      workers: 1
      max_pending: 32
    alignment:
      workers: 1
      max_pending: 32
    transcription:
      workers: 1
      max_pending: 32
    diarization:
      workers: 1
      max_pending: 32
    subtitle:
      workers: 1
      max_pending: 32
    reference_extraction:
      workers: 1
      max_pending: 32

downloads:
  chunk_bytes: 1048576

storage:
  artifacts:
    root: .dictator-artifacts
