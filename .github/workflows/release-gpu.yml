name: Publish GPU image

on:
  push:
    tags:
      - '**'

permissions:
  contents: read
  packages: write

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tags: ${{ steps.image_tags.outputs.image_tags }}
      tag_commit: ${{ steps.tag.outputs.tag_commit }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag commit
        id: tag
        run: |
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if [ -z "$tag_commit" ]; then
            echo "::error::Unable to resolve commit for tag ${GITHUB_REF_NAME}."
            exit 1
          fi
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Build semver Docker tags
        id: image_tags
        run: |
          git_tag="${GITHUB_REF_NAME}"
          semver_regex='^v?([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?$'

          if [[ ! "$git_tag" =~ $semver_regex ]]; then
            echo "::error::Git tag ${git_tag} must be semver like 1.2.3 or v1.2.3. Optional prerelease suffixes such as -rc.1 are supported. Build metadata (+...) is not supported for Docker tags."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          prerelease="${BASH_REMATCH[4]}"
          version="${major}.${minor}.${patch}${prerelease}"
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}-gpu"

          tags=(
            "${image_name}:${version}"
          )

          if [[ "$git_tag" != "$version" ]]; then
            tags+=("${image_name}:${git_tag}")
          fi

          if [[ -z "$prerelease" ]]; then
            tags+=(
              "${image_name}:${major}.${minor}"
              "${image_name}:${major}"
              "${image_name}:latest"
            )
          fi

          {
            echo "image_tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tagged commit is contained in origin/master
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          if git merge-base --is-ancestor "${{ steps.tag.outputs.tag_commit }}" origin/master; then
            echo "Tag ${GITHUB_REF_NAME} resolves to commit ${{ steps.tag.outputs.tag_commit }}, which is contained in origin/master."
            exit 0
          fi

          echo "::error::Tag ${GITHUB_REF_NAME} resolves to commit ${{ steps.tag.outputs.tag_commit }}, which is not contained in origin/master."
          exit 1

  tests:
    needs: verify-tag
    uses: ./.github/workflows/test.yml

  publish-gpu-image:
    needs:
      - verify-tag
      - tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GPU image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ needs.verify-tag.outputs.image_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
