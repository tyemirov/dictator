name: Validate GPU release tag

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate semver tag and master ancestry
        run: ./scripts/docker-gh-deploy.sh --dry-run --skip-tests --skip-login "${GITHUB_REF_NAME}"

  tests:
    needs: validate-tag
    uses: ./.github/workflows/test.yml
